<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Виробничий Сканер</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 450px; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.1); }
        h2 { margin-top: 0; text-align: center; }
        input[type="email"], input[type="text"] { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 10px; font-size: 16px;}
        button { cursor: pointer; font-size: 16px;}
        .primary { width: 100%; padding: 12px; border: none; border-radius: 6px; background: #0078d4; color: white; font-weight: bold; }
        #error-msg { color: red; display: none; text-align: center; margin-top: 10px; font-weight: bold;}
        #scanner-section { display: none; }
        #reader { width: 100%; margin-bottom: 15px; }
        #scanned-list { list-style: none; padding: 0; margin: 10px 0 20px; max-height: 200px; overflow-y: auto; border: 1px solid #ddd; border-radius: 6px; }
        #scanned-list li { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center;}
        .process-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .process-btn { border: none; border-radius: 6px; padding: 14px; background: #28a745; color: white; font-weight: bold; }
        .warning-btn { background: #ffc107; color: #333; }
        .user-info { text-align: center; margin-bottom: 15px; font-size: 15px;}
        .logout-link { color: red; cursor: pointer; font-weight: bold; text-decoration: underline;}
    </style>
</head>
<body>

<div class="container">
    <div id="auth-section">
        <h2>Вхід у систему</h2>
        <input type="text" id="employee-id-input" placeholder="Введіть ваш номер працівника (напр. d1)" required>
        <button class="primary" onclick="saveEmployeeId()">Увійти</button>
        <div id="error-msg">Доступ заборонено! Номер відсутній у базі.</div>
    </div>

    <div id="scanner-section">
        <div class="user-info">
            Працює: <strong id="current-user"></strong>
            (<span class="logout-link" onclick="logout()">Змінити</span>)
        </div>

        <div id="reader"></div>

        <h3 style="margin-top: 0; margin-bottom: 5px;">Відскановано: <span id="scan-count">0</span></h3>
        <ul id="scanned-list"></ul>

        <h3 style="margin-top: 0; margin-bottom: 10px;">Оберіть процес:</h3>
        <div class="process-grid">
            <button class="process-btn" onclick="sendData('Зварювання')">Зварювання</button>
            <button class="process-btn" onclick="sendData('Пайка')">Пайка</button>
            <button class="process-btn" onclick="sendData('Обклейка')">Обклейка</button>
            <button class="process-btn warning-btn" onclick="sendData('Тестування ВТК')">Тестування ВТК</button>
        </div>
    </div>
</div>

<script>
    // ВСТАВТЕ ВАШЕ ПОВНЕ ПОСИЛАННЯ ТУТ (в межах лапок):
    const WEBHOOK_URL = "https://default72f43a8cba9c4477b13bbff064a535.0e.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/16/workflows/e9cda871677c4fe78e30482505694602/triggers/manual/paths/invoke?api-version=1";

    // Список ідентифікаторів працівників (можна додавати нові)
    const allowedEmployeeIds = ["d1", "d2", "d3", "d4"];

    let scannedItems = new Set();
    let pendingScans = [];
    let html5QrcodeScanner = null;

    window.onload = function () {
        const savedEmployeeId = localStorage.getItem("employeeId");
        if (savedEmployeeId && allowedEmployeeIds.includes(savedEmployeeId)) {
            showScanner(savedEmployeeId);
        }
    };

    function saveEmployeeId() {
        const employeeId = document.getElementById("employee-id-input").value.trim().toLowerCase();
        const error = document.getElementById("error-msg");

        if (!employeeId) {
            alert("Введіть ваш номер працівника");
            return;
        }

        if (!allowedEmployeeIds.includes(employeeId)) {
            error.style.display = "block";
            return;
        }

        error.style.display = "none";
        localStorage.setItem("employeeId", employeeId);
        showScanner(employeeId);
    }

    function logout() {
        localStorage.removeItem("employeeId");
        location.reload();
    }

    function showScanner(employeeId) {
        document.getElementById("auth-section").style.display = "none";
        document.getElementById("scanner-section").style.display = "block";
        document.getElementById("current-user").innerText = employeeId.toUpperCase();

        setTimeout(() => {
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            html5QrcodeScanner.render(onScanSuccess);
        }, 200);
    }

    function onScanSuccess(decodedText) {
        if (scannedItems.has(decodedText) || pendingScans.some(item => item.serial === decodedText)) {
            return;
        }

        const li = document.createElement("li");
        li.style.backgroundColor = "#fff3cd"; // Жовтий для нових
        li.innerHTML = `<strong>${decodedText}</strong> <span class="status">⌛ Очікує</span>`;
        document.getElementById("scanned-list").prepend(li);

        pendingScans.push({ serial: decodedText, li: li });
        document.getElementById("scan-count").innerText = pendingScans.length;
    }

    function sendData(operation) {
        if (pendingScans.length === 0) {
            alert("Спочатку відскануйте хоча б один серійний номер батареї!");
            return;
        }

        if (WEBHOOK_URL === "https://default72f43a8cba9c4477b13bbff064a535.0e.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/16/workflows/e9cda871677c4fe78e30482505694602/triggers/manual/paths/invoke?api-version=1") {
            alert("Помилка налаштування: Не вставлено посилання на Power Automate в коді.");
            return;
        }

        const employeeId = localStorage.getItem("employeeId");
        const itemsToProcess = [...pendingScans];
        pendingScans = []; // Очищаємо чергу для наступних сканувань

        itemsToProcess.forEach(item => {
            const serial = item.serial;
            const li = item.li;

            li.innerHTML = `<strong>${serial}</strong> <span>Відправка...</span>`;

            fetch(WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    serialNumber: serial,
                    operation: operation,
                    workerEmail: employeeId // Відправляємо номер працівника у поле workerEmail
                })
            })
            .then(response => {
                if (response.ok || response.status === 202) {
                    scannedItems.add(serial);
                    li.style.backgroundColor = "#d4edda"; // Зелений успіх
                    li.innerHTML = `<strong>${serial}</strong> <span style="color: #155724;">✅ ${operation}</span>`;
                } else {
                    li.style.backgroundColor = "#f8d7da"; // Червона помилка
                    li.innerHTML = `<strong>${serial}</strong> <span style="color: red;">❌ Помилка</span>`;
                    pendingScans.push(item); // Повертаємо в чергу
                }
                document.getElementById("scan-count").innerText = pendingScans.length;
            })
            .catch(error => {
                console.error(error);
                li.style.backgroundColor = "#f8d7da";
                li.innerHTML = `<strong>${serial}</strong> <span style="color: red;">❌ З'єднання</span>`;
                pendingScans.push(item); // Повертаємо в чергу
                document.getElementById("scan-count").innerText = pendingScans.length;
            });
        });
    }
</script>

</body>
</html>
