<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Виробничий Сканер</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 400px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-top: 0; }
        
        #auth-section { display: block; }
        input[type="email"] { width: 100%; padding: 12px; margin: 10px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button.primary { width: 100%; padding: 12px; background-color: #0078D4; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        #error-msg { color: #d9534f; font-weight: bold; text-align: center; margin-top: 10px; display: none; }
        
        #scanner-section { display: none; }
        #reader { width: 100%; margin-bottom: 20px; }
        
        #scanned-list { list-style: none; padding: 0; margin: 0 0 20px 0; max-height: 150px; overflow-y: auto; border: 1px solid #eee; }
        #scanned-list li { padding: 10px; border-bottom: 1px solid #eee; background: #f9f9f9; font-family: monospace; font-size: 16px; display: flex; justify-content: space-between; }
        
        .process-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button.process-btn { padding: 15px 10px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-size: 14px; font-weight: bold; cursor: pointer; }
        button.process-btn:active { background-color: #218838; }
        
        .user-info { text-align: center; font-size: 14px; color: #666; margin-bottom: 15px; }
        .user-info a { color: #d9534f; text-decoration: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    
    <div id="auth-section">
        <h2>Вхід у систему</h2>
        <input type="email" id="email-input" placeholder="Введіть дозволену пошту" required>
        <button class="primary" onclick="saveEmail()">Увійти</button>
        <div id="error-msg">Доступ заборонено! Пошти немає в базі.</div>
    </div>

    <div id="scanner-section">
        <div class="user-info">
            Працює: <span id="current-user"></span> 
            (<a onclick="logout()">Змінити</a>)
        </div>

        <div id="reader"></div>
        <h3 style="margin-bottom: 5px;">Відскановано (<span id="scan-count">0</span>):</h3>
        <ul id="scanned-list"></ul>

        <h3 style="margin-bottom: 10px;">Оберіть процес:</h3>
        <div class="process-grid">
            <button class="process-btn" onclick="sendData('Зварювання')">Зварювання</button>
            <button class="process-btn" onclick="sendData('Пайка')">Пайка</button>
            <button class="process-btn" onclick="sendData('Обклейка')">Обклейка</button>
            <button class="process-btn" style="background-color: #ffc107; color: #333;" onclick="sendData('Тестування')">Тестування ВТК</button>
        </div>
    </div>

</div>

<script>
    const WEBHOOK_URL = "https://default72f43a8cba9c4477b13bbff064a535.0e.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/16/workflows/e9cda871677c4fe78e30482505694602/triggers/manual/paths/invoke?api-version=1";

    const allowedEmails = [
        "ivanenko@gmail.com",
        "petrenko@ukr.net",
        "vlad@gmail.com",
        "test@test.com"
    ];

    let scannedItems = new Set();
    let html5QrcodeScanner;

    window.onload = function() {
        const savedEmail = localStorage.getItem("workerEmail");
        if (savedEmail && allowedEmails.includes(savedEmail)) {
            showScanner(savedEmail);
        } else {
            logout(); 
        }
    };

    function saveEmail() {
        const emailInput = document.getElementById("email-input").value.trim().toLowerCase();
        const errorMsg = document.getElementById("error-msg");
        
        if (emailInput === "") {
            alert("Введіть пошту!");
            return;
        }

        if (allowedEmails.includes(emailInput)) {
            errorMsg.style.display = "none";
            localStorage.setItem("workerEmail", emailInput);
            showScanner(emailInput);
        } else {
            errorMsg.style.display = "block"; 
        }
    }

    function logout() {
        localStorage.removeItem("workerEmail");
        document.getElementById("auth-section").style.display = "block";
        document.getElementById("scanner-section").style.display = "none";
        if(html5QrcodeScanner){
            html5QrcodeScanner.clear();
        }
    }

    function showScanner(email) {
        document.getElementById("auth-section").style.display = "none";
        document.getElementById("scanner-section").style.display = "block";
        document.getElementById("worker-email-display").innerText = "Працівник: " + email;

        html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
        html5QrcodeScanner.render(onScanSuccess);
    }

    function onScanSuccess(decodedText) {
        document.getElementById("result").innerText = decodedText;
    }

    function sendData(operation) {
        const serialNumber = document.getElementById("result").innerText;
        const workerEmail = localStorage.getItem("workerEmail");

        if (serialNumber === "..." || serialNumber === "") {
            alert("Спочатку відскануйте серійний номер!");
            return;
        }

        // Перевірка на дублікати під час цієї сесії
        if (scannedItems.has(serialNumber)) {
            alert("Цей серійний номер вже відскановано!");
            return;
        }

        // Відправка даних у Power Automate
        fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                serialNumber: serialNumber,
                operation: operation,
                workerEmail: workerEmail
            })
        })
        .then(response => {
            if (response.ok || response.status === 202) { // Power Automate часто повертає статус 202
                alert("Успіх! Операцію записано.");
                scannedItems.add(serialNumber); // Додаємо до списку відсканованих
                document.getElementById("result").innerText = "..."; // Очищаємо поле для наступного
            } else {
                alert("Помилка відправки. Статус: " + response.status);
            }
        })
        .catch(error => {
            alert("Помилка підключення до сервера.");
            console.error(error);
        });
    }
</script>

</body>
</html>
