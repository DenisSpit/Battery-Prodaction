<script>
const WEBHOOK_URL =
"https://default72f43a8cba9c4477b13bbff064a535.0e.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/16/workflows/e9cda871677c4fe78e30482505694602/triggers/manual/paths/invoke?api-version=1";

const allowedEmails = [
    "ivanenko@gmail.com",
    "petrenko@ukr.net",
    "vlad@gmail.com",
    "test@test.com"
];

let scannedItems = new Set();
let pendingScans = [];
let html5QrcodeScanner = null;

window.onload = function () {

    const savedEmail = localStorage.getItem("workerEmail");

    if (savedEmail && allowedEmails.includes(savedEmail)) {
        showScanner(savedEmail);
    } else {
        document.getElementById("auth-section").style.display = "block";
        document.getElementById("scanner-section").style.display = "none";
    }
};

function saveEmail() {

    const email = document
        .getElementById("email-input")
        .value
        .trim()
        .toLowerCase();

    const errorMsg = document.getElementById("error-msg");

    if (!email) {
        alert("Введіть пошту!");
        return;
    }

    if (!allowedEmails.includes(email)) {
        errorMsg.style.display = "block";
        return;
    }

    errorMsg.style.display = "none";

    localStorage.setItem("workerEmail", email);

    showScanner(email);
}

function logout() {

    localStorage.removeItem("workerEmail");

    scannedItems.clear();
    pendingScans = [];

    document.getElementById("scanned-list").innerHTML = "";
    document.getElementById("scan-count").innerText = "0";

    document.getElementById("scanner-section").style.display = "none";
    document.getElementById("auth-section").style.display = "block";

    if (html5QrcodeScanner) {
        html5QrcodeScanner.clear().catch(() => {});
    }
}

function showScanner(email) {

    document.getElementById("auth-section").style.display = "none";
    document.getElementById("scanner-section").style.display = "block";

    document.getElementById("current-user").innerText = email;

    setTimeout(() => {

        if (html5QrcodeScanner) {
            html5QrcodeScanner.clear().catch(() => {});
        }

        html5QrcodeScanner = new Html5QrcodeScanner(
            "reader",
            {
                fps: 10,
                qrbox: 250
            }
        );

        html5QrcodeScanner.render(onScanSuccess);

    }, 100);
}

function onScanSuccess(decodedText) {

    if (
        scannedItems.has(decodedText) ||
        pendingScans.some(x => x.serial === decodedText)
    ) {
        return;
    }

    const list = document.getElementById("scanned-list");

    const li = document.createElement("li");

    li.style.backgroundColor = "#fff3cd";

    li.innerHTML =
        `<strong>${decodedText}</strong>
        <span class="status">⌛ Очікує дії</span>`;

    list.insertBefore(li, list.firstChild);

    pendingScans.push({
        serial: decodedText,
        li: li
    });

    document.getElementById("scan-count").innerText =
        pendingScans.length + scannedItems.size;
}

function sendData(operation) {

    if (pendingScans.length === 0) {
        alert("Спочатку відскануйте хоча б один серійний номер батареї!");
        return;
    }

    const workerEmail =
        localStorage.getItem("workerEmail");

    const itemsToProcess = [...pendingScans];

    pendingScans = [];

    itemsToProcess.forEach(item => {

        const serial = item.serial;
        const li = item.li;

        if (li.querySelector(".status")) {
            li.querySelector(".status").innerText =
                "Відправка...";
        }

        fetch(WEBHOOK_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                serialNumber: serial,
                operation: operation,
                workerEmail: workerEmail
            })
        })
        .then(response => {

            if (response.ok || response.status === 202) {

                scannedItems.add(serial);

                li.style.backgroundColor = "#d4edda";

                li.innerHTML =
                    `<strong>${serial}</strong>
                    <span style="color:#155724;">
                        ✔ ${operation}
                    </span>`;

            } else {

                pendingScans.push(item);

                li.style.backgroundColor = "#f8d7da";

                li.innerHTML =
                    `<strong>${serial}</strong>
                    <span style="color:red;">
                        ❌ Помилка
                    </span>`;
            }

            document.getElementById("scan-count").innerText =
                pendingScans.length + scannedItems.size;
        })
        .catch(error => {

            console.error(error);

            pendingScans.push(item);

            li.style.backgroundColor = "#f8d7da";

            li.innerHTML =
                `<strong>${serial}</strong>
                <span style="color:red;">
                    ❌ З'єднання
                </span>`;

            document.getElementById("scan-count").innerText =
                pendingScans.length + scannedItems.size;
        });

    });
}
</script>
